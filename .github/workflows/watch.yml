name: feed-watch

# Fetches two feeds from a GitHub-hosted runner (US/Azure datacenter) every 15 min.
# Purpose: the MacMini watcher sits in Portugal and has never seen a failure, while
# FeedLand reports ~50% errors on the VdL feed. This samples the SAME two feeds from
# a datacenter IP on another continent, so a VdL-fails / refarmer-succeeds split here
# points at ICDsoft treating datacenter traffic differently, not at the feed.
# refarmer.blog is the control: same runner, same moment, known-healthy origin.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-watch
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe feeds
        run: |
          set -u
          probe () {
            # curl's own timing breakdown; 30s timeout deliberately generous so a slow
            # success is recorded with its true duration instead of truncated by us.
            curl -s -o /dev/null --max-time 30 \
              -w "%{http_code}\t%{time_namelookup}\t%{time_connect}\t%{time_appconnect}\t%{time_starttransfer}\t%{time_total}\t%{size_download}\t%{remote_ip}" \
              "$1" 2>/dev/null || echo -e "000\t0\t0\t0\t0\t0\t0\t-"
          }
          UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for url in https://www.valedalama.net/feed/ https://refarmer.blog/feed/; do
            for i in 1 2 3; do
              out=$(probe "$url"); code=$(printf '%s' "$out" | cut -f1)
              printf '%s\t%s\t%s\t%s\n' "$UTC" "$url" "$out" "$RUNNER_OS" >> log.tsv
              [ "$code" = "200" ] || echo "::warning::$url returned $code"
              sleep 3
            done
          done
          tail -6 log.tsv

      - name: Commit results
        run: |
          git config user.name  "feed-watch"
          git config user.email "feed-watch@users.noreply.github.com"
          git add log.tsv
          git diff --staged --quiet || git commit -m "probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main || true
          git push
